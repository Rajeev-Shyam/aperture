[package]
name = "aperture-orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orchestration & resource manager (doc 12) — \"the brain\": owns the capture toggle (single writer, doc 02 §7), the single-permit GPU mutex + priority queue, sidecar lifecycles, the R1 VRAM projection check, and tier routing. Implements aperture_contracts::GpuScheduler; the ONLY crate besides the gateway permitted to spawn a process (sidecars, doc 12 §5)."

[dependencies]
aperture-contracts = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# Required: `impl aperture_contracts::GpuScheduler` is `#[async_trait::async_trait]` (lib.rs).
async-trait = { workspace = true }

# Loopback HTTP to the LOCAL sidecars (vlm-host /infer, /health) + health polling
# (doc 12 §5). 127.0.0.1 only — never reaches the public internet; orchestration
# is a lint-emitters SANCTIONED crate (doc 13 §2). rustls avoids an OpenSSL build
# dep on Windows MSVC. "multipart": binary payloads (frame JPEG / WAV) ride as
# raw multipart parts to the sidecar hosts (decision #33), not JSON number arrays.
# ONE sanctioned exception to "loopback only": model_fetch.rs — the explicit,
# user-click-initiated VLM weight INGRESS from Hugging Face (decision #30);
# carries no user data, see its module doc.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }  # [VERIFY]
# SHA-256 of the streamed VLM weights (model_fetch.rs) — content verification
# at download time, not just byte count (SDLC review 2026-08-19 finding 5).
# Same crate/version privacy + reasoning-gateway already pull in.
sha2 = "0.10"  # [VERIFY]

[dev-dependencies]
# Loopback fakes only: the decision #33 round-trip test (a fake sidecar host
# decoding the SidecarRunner's multipart leg) and the decision #30 model_fetch
# tests (a fake Range-aware origin — the real 3 GB download stays #[ignore]d).
axum = { version = "0.7", features = ["multipart"] }

# --- platform / third-party (pinned; [VERIFY] at build time, doc 00 conventions) ---
# Win32 TerminateProcess escalation when a sidecar kill fails (zombie escalation,
# doc 12 §7). Process death is the guaranteed VRAM-release primitive (doc 02 §2,
# doc 12 §5). NOTE: ModelLifecycle's std::process::Command sidecar spawn is the
# ONLY sanctioned Command use outside the reasoning gateway (two-emitter rule).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",        # OpenProcess / TerminateProcess
    "Win32_Foundation",              # HANDLE / CloseHandle
    "Win32_System_JobObjects",       # sidecar tree-kill (KILL_ON_JOB_CLOSE)
    "Win32_Security",                # CreateJobObjectW's SECURITY_ATTRIBUTES param
] }  # [VERIFY] at build time
