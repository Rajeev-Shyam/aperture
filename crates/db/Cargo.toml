[package]
name = "aperture-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite (WAL) + sqlite-vec storage, migrations, and the single-writer Tier-0 pipeline (doc 03). At-rest encryption is applied at connect time (doc 13)."

[dependencies]
aperture-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# rusqlite `bundled` ships SQLite. [VERIFY resolved — Step 0]: sqlite-vec is the
# crates.io `sqlite-vec` crate (C extension built via cc, registered via
# sqlite3_auto_extension before connections open); libsqlite3-sys is pinned to
# rusqlite's bundled copy so the extension links against the same SQLite.
rusqlite = { workspace = true }
sqlite-vec = "0.1"
libsqlite3-sys = "*"  # version driven by rusqlite's bundled selection

# At-rest encryption (doc 13 §6, M9). OFF by default because
# `bundled-sqlcipher-vendored-openssl` compiles OpenSSL from source, which on
# Windows needs a **native** Perl (Strawberry) + NASM on PATH — the Git-for-
# Windows/Cygwin perl fails with a missing `Locale::Maketext::Simple`.
#
# Turn it on for a release/gate build:
#     cargo build -p aperture-db --features sqlcipher
# With the feature OFF, `Db::is_encrypted()` returns false and the shell logs a
# prominent warning: we never claim encryption we did not apply.
[features]
default = []
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
